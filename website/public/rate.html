<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rate your visit · REFILL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EFE6">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="small-page">
<header class="top top--solid js-top">
  <a class="top__mark" href="/" aria-label="Refill, home">REFILL</a>
  <div class="top__end"><a class="top__pill" style="display:inline-flex" href="/menu">Menu</a></div>
</header>
<main class="pg">
  <div class="pg__main">
    <p class="label js-table-label">How was your visit?</p>
    <h1 class="pg__title"><span class="ln"><span>How refilled</span></span><span class="ln"><span>are you?</span></span></h1>
    <p class="ar" lang="ar" dir="rtl">مزاجك اتملى قد إيه؟</p>
    <form class="js-rate" novalidate>
      <div class="cups" role="radiogroup" aria-label="How refilled are you?">
        <button class="cup" role="radio" aria-checked="false" type="button" data-score="1"><i style="--l:.12"></i><span>Still sleepy</span></button>
        <button class="cup" role="radio" aria-checked="false" type="button" data-score="2"><i style="--l:.32"></i><span>Waking up</span></button>
        <button class="cup" role="radio" aria-checked="false" type="button" data-score="3"><i style="--l:.55"></i><span>Getting there</span></button>
        <button class="cup" role="radio" aria-checked="false" type="button" data-score="4"><i style="--l:.78"></i><span>Good day</span></button>
        <button class="cup" role="radio" aria-checked="false" type="button" data-score="5"><i style="--l:1"></i><span>Refilled</span></button>
      </div>
      <p class="rate__answer js-answer" aria-live="polite">Pick a cup. Honest answers welcome.</p>
      <label class="label rate__label" for="note">Anything to add? Optional</label>
      <textarea class="field js-note" id="note" maxlength="500" placeholder="What was great, or what was not."></textarea>
      <div class="pg__actions"><button class="btn js-send" type="submit" disabled>Send</button></div>
    </form>
    <div class="js-thanks" hidden>
      <p class="rate__answer">Thank you. That goes straight to the team.</p>
      <div class="pg__actions"><a class="btn js-review" target="_blank" rel="noopener" hidden>Tell everyone on Google</a><a class="btn btn--ghost" href="/menu">Back to the menu</a></div>
    </div>
  </div>
  <footer class="pg__foot"><span>Good coffee. Better days.</span><a href="/">refill</a><a class="credit" href="https://najmarketing.co" target="_blank" rel="noopener">Powered by <b>najmarketing.co</b></a></footer>
</main>
<script src="/config.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="/js/site.js"></script>
<script src="/js/rate.js"></script>
</body>
</html>
